<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudScore (prototype)</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#111;color:#eee}
header{background:#107c10;padding:16px 20px}header h1{margin:0;font-size:22px}
main{max-width:1000px;margin:auto;padding:20px}
.muted{color:#aaa}.small{font-size:12px}
textarea{width:100%;height:60px;background:#222;color:#eee;border:1px solid #333;border-radius:6px}
button{background:#107c10;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;margin:6px 6px 0 0}
.banner{display:flex;justify-content:space-between;align-items:center;background:#1c1c1c;padding:16px;border-radius:10px;margin-top:20px}
.big{font-size:40px;font-weight:800;color:#5dc21e}.stats{display:flex;gap:20px}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:6px}.bar div{height:100%;background:#5dc21e}.bar.main{height:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tile{display:flex;gap:12px;background:#1c1c1c;border-left:4px solid #5dc21e;padding:12px;border-radius:8px}
.tile.locked{opacity:.55;border-left-color:#555}.icon{font-size:30px}.body{flex:1}
.row{display:flex;justify-content:space-between}.g{color:#5dc21e;font-weight:700}.win{margin-top:4px;font-size:13px}
footer{font-size:12px;color:#777;margin-top:30px}
</style></head><body>
<header><h1>🏆 StudScore <span style="font-weight:400;font-size:14px">prototype</span></h1></header>
<main>
<p>Upload your <b>Rebrickable</b> set list (CSV export), or paste set numbers, to see your achievement board.</p>
<input type="file" id="file" accept=".csv,.txt"><br>
<textarea id="paste" placeholder="e.g. 7965, 7774-1, 6915"></textarea><br>
<button id="go">Show my board</button><button id="demo">Try a demo collection</button>
<div id="board"></div>
<footer>Set data from <a href="https://rebrickable.com/downloads/" style="color:#9c9">Rebrickable</a>. LEGO® is a trademark of the LEGO Group, which does not sponsor or endorse this prototype.</footer>
</main>
<script src="data.js"></script><script src="lore.js"></script><script src="app.js"></script><script src="share.js"></script></body></html>
